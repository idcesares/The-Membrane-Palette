name: Verbal System v2 migration

on:
  push:
    branches: [verbal-system-v2]

permissions:
  contents: write

concurrency:
  group: verbal-system-v2-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: verbal-system-v2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply strict source migration
        run: node scripts/migrate-verbal-v2-fixed.mjs

      - name: Regenerate committed outputs
        run: npm run build:system

      - name: Commit migrated sources and generated outputs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Migration already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply Verbal System v2 semantics"
          git push origin HEAD:verbal-system-v2
