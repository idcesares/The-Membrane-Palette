name: Verbal System v2 release preparation

on:
  push:
    branches: [verbal-system-v2]

permissions:
  contents: write

concurrency:
  group: verbal-system-v2-release-prep
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: verbal-system-v2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prepare v2.2.0 release metadata
        run: node scripts/prepare-verbal-v2-release.mjs

      - name: Regenerate committed outputs
        run: npm run build:system

      - name: Validate verbal authorities
        run: npm run check:verbal

      - name: Install Chromium for social asset rendering
        run: npx playwright install --with-deps chromium

      - name: Render versioned social assets
        run: npm run render:social

      - name: Commit release-candidate sources and generated outputs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Release-candidate preparation already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare Verbal System v2.2.0 release candidate"
          git push origin HEAD:verbal-system-v2
