name: Update approved Verbal System v2 baselines

on:
  push:
    branches: [verbal-system-v2]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
        with:
          ref: verbal-system-v2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Record baselines in canonical image
        run: npm run test:visual -- --update-snapshots

      - name: Prove only the reviewed Button/Navbar baselines changed
        run: |
          changed="$(git status --porcelain tests/visual.spec.mjs-snapshots/ | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            tests/visual.spec.mjs-snapshots/button-1-dark-visual-linux.png \
            tests/visual.spec.mjs-snapshots/button-1-light-visual-linux.png \
            tests/visual.spec.mjs-snapshots/navbar-1-dark-visual-linux.png \
            tests/visual.spec.mjs-snapshots/navbar-1-light-visual-linux.png | sort)"
          printf 'Changed baselines:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Commit reviewed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.mjs-snapshots/
          git commit -m "test: update Verbal System v2 visual baselines"
          git push origin HEAD:verbal-system-v2
