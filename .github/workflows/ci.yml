name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build tokens, components & showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerates tokens/design-tokens.css and tokens/base.css from
      # tokens/membrane.tokens.json. Fails if any color fails its OKLCH
      # round-trip, or if any gated contrast pair (light + dark, including
      # hover fills, status washes and code syntax colors) falls below its
      # WCAG minimum.
      - name: Build tokens (OKLCH round-trip + WCAG contrast gate)
        run: npm run build:tokens

      # Lints every component against the token system (no raw colors, no
      # Tier 1 primitives, no deprecated or unknown tokens) and every README
      # example against the component CSS (no invented classes or values),
      # then writes the bundles, manifest, llms.txt and generated docs.
      - name: Build components (token lint + docs lint)
        run: npm run build:components

      # Every generated artifact is committed so the CDN can serve it.
      # Fail if anything the two builds wrote differs from what's committed.
      - name: Verify generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'npm run build:system' locally and commit the result."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      # Assembles dist/ the same way the Cloudflare Pages deploy does.
      - name: Build showcase (Cloudflare Pages assembly)
        run: npm run build

  test:
    name: Accessibility & behavior tests (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds dist/ and validates its HTML, then serves it and runs axe-core
      # on every page in light and dark mode, a phone-width overflow check,
      # link integrity (site + Markdown), the keyboard / focus / ARIA
      # behavior of tabs, dialog, tooltip, menu and toast, and motion under
      # full, reduced and touch settings.
      - name: Run tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
